name: ilnd_app
description: "ilnd — iyi hisset, iyi yaşa."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  intl: ^0.20.2
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  supabase_flutter: ^2.8.4
  cloud_firestore: ^5.6.6
  firebase_core: ^3.13.0
  firebase_analytics: ^11.4.0
  firebase_auth: ^5.3.0
  firebase_crashlytics: ^4.3.5
  firebase_app_check: ^0.3.2
  share_plus: ^10.1.2
  google_fonts: ^6.2.1
  shared_preferences: ^2.5.5
  image_picker: ^1.2.3
  http: ^1.2.2
  purchases_flutter: ^8.0.0
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.4
  crypto: ^3.0.6
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  video_player: ^2.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Yalnız test için: yemek analizi testlerinde ImagePickerPlatform.instance
  # sahte bir uygulamayla değiştiriliyor (test/features/ekle/).
  image_picker_platform_interface: ^2.11.1
  flutter_native_splash: ^2.4.5

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true

  # Lora'nın OFL metni uygulamanın lisans listesine kaydediliyor
  # (main.dart, LicenseRegistry): OFL fontun lisansıyla dağıtılmasını
  # şart koşuyor.
  assets:
    - assets/fonts/Lora-OFL.txt
    - assets/island/
    - assets/explore/

  # Üç aile de pakete GÖMÜLÜ, hiçbiri çalışma anında indirilmiyor.
  #
  # google_fonts ile indirildikleri sürece ağsız ilk açılışta hepsi sistem
  # fontlarına düşüyordu, yani uygulama kimliğini kaybediyordu. App Store
  # incelemesi de aynı riski taşıyordu.
  fonts:
    # Lora: Ada tasarımının başlık fontu (OFL, assets/fonts/Lora-OFL.txt).
    # Google Fonts yalnız değişken kesim yayınlıyor; statik 400/600 ve
    # italik 400 fonttools varLib.instancer ile üretildi. Değişken dosyayı
    # doğrudan gömseydik pubspec'teki ağırlık bir şey ifade etmezdi:
    # kod 600 der, ekran 400 çizerdi.
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-Regular.ttf
          weight: 400
        - asset: assets/fonts/Lora-SemiBold.ttf
          weight: 600
        # İtalik kelime vurgusu markanın imzası (DESIGN_SYSTEM §2). Noto
        # Serif'te italik kesim YOKTU, Flutter eğik taklit çiziyordu.
        - asset: assets/fonts/Lora-Italic.ttf
          weight: 400
          style: italic
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700
    # DM Mono yalnız 500'e kadar çıkıyor (600/700 kesimi ÜRETİLMEMİŞ).
    # Sayı stilleri buna göre 500'e sabitlendi; kodun 700 deyip 500 çizmesi
    # istenmedi. Monospace olduğu için hizalama zaten garanti, tabular
    # rakam özelliğine (tnum) ihtiyaç yok.
    - family: DMMono
      fonts:
        - asset: assets/fonts/DMMono-Medium.ttf
          weight: 500

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

flutter_native_splash:
  color: "#F7F5FF"
  color_dark: "#0F0D1A"
  android_12:
    color: "#F7F5FF"
    color_dark: "#0F0D1A"

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
