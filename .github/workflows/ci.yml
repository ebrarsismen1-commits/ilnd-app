name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Güvenlik denetimi M-12: GITHUB_TOKEN yalnız okuma. Bu iş akışı depoya,
# sürümlere ya da PR'lara yazmıyor; varsayılan geniş yetki gerekmez.
permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.1"

jobs:
  flutter:
    name: Flutter analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flutter-coverage
          path: coverage/lcov.info
          retention-days: 14

  flutter-build:
    name: Build Android (debug-signed, build-verification only)
    runs-on: ubuntu-latest
    needs: flutter
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      # `google-services.json` is gitignored on purpose (docs/tr/GUVENLIK.md),
      # so it has to be materialized here — without it the Google Services
      # Gradle plugin aborts the build outright. Two paths, in order:
      #   1. the GOOGLE_SERVICES_JSON_BASE64 repo secret — the real config;
      #   2. android/app/google-services.ci-placeholder.json — same package
      #      name, fake ids, enough for the plugin to run.
      # Path 2 exists because secrets are not exposed to pull requests from
      # forks: without it, PR CI could never build. Either way the artifact
      # this job produces is debug-signed and NOT publishable; the real store
      # build lives in release.yml and refuses to run without the secret.
      # android/gradle.properties daemon'i bilerek 1.5 GB'a kisitliyor: bakim
      # yapan makine ayni anda Android Studio + emulator calistiriyor. CI
      # runner'inda o tavan release derlemesine yetmiyor (Java heap space,
      # 17 dk sonra). Burada YALNIZ CI icin yukseltiliyor — GRADLE_USER_HOME
      # altindaki gradle.properties proje dosyasini ezer, yani yerel makine
      # ayarindan etkilenmiyor.
      - name: Raise the Gradle heap for CI only
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g" >> ~/.gradle/gradle.properties

      - name: Materialize google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
            echo "google-services.json written from the repo secret."
          else
            cp android/app/google-services.ci-placeholder.json android/app/google-services.json
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 is not set, so this build used the placeholder Firebase config. The build itself is still verified; the resulting APK/AAB will not talk to Firebase and must not be distributed."
          fi

      # No `android/key.properties` exists in this job — every build here is
      # debug-signed. That's fine for verifying the build doesn't break; it
      # is NOT a publishable artifact. See android/KEYSTORE.md for what's
      # needed to produce a real, store-signed app bundle.
      - name: Build APK (debug-signed)
        run: flutter build apk --release

      - name: Build App Bundle (debug-signed)
        run: flutter build appbundle --release

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-debug-signed-builds
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
          retention-days: 7

  functions:
    name: Cloud Functions lint + emulator tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Cloud Functions runtime (functions/package.json engines). Node 20
          # is decommissioned on 2026-10-30; after that deploys are blocked.
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      # The Firestore/Auth emulators run on the JVM, and firebase-tools
      # refuses to start them on anything older than JDK 21. The runner's
      # preinstalled JDK is older than that, so pin it explicitly here
      # rather than inheriting whatever the image happens to ship.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      # firebase-tools is installed on the fly rather than as a devDependency
      # so functions/package.json stays focused on runtime deps.
      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.30.0

      - name: Run tests against the Firebase Emulator Suite
        env:
          # Optional. There is no App Check emulator; App Check is verified
          # manually (functions/appCheck.js) and defaults to "monitor", so the
          # suite passes without it. Enforce-mode rejection is covered by
          # test/backendAuth.test.js.
          FIREBASE_APP_CHECK_TEST_APP_ID: ${{ secrets.FIREBASE_APP_CHECK_TEST_APP_ID }}
        run: firebase emulators:exec --project demo-ilnd-test "npm test"
