name: Release (signed Android build)

# Fires on version tags (v1.0.0, v1.0.1, ...). Produces a real, store-signed
# .aab using the upload keystore — unlike ci.yml's build job, which is
# debug-signed and only verifies the build compiles.
on:
  push:
    tags:
      - "v*.*.*"

# Güvenlik denetimi M-12: GITHUB_TOKEN yalnız okuma. Derleme çıktısı
# artifact olarak yüklenir; depoya ya da sürümlere yazılmaz.
permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.1"

jobs:
  build-signed:
    name: Build signed App Bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      # Reconstructs android/key.properties + the upload keystore from repo
      # secrets at build time. None of this is ever written to disk outside
      # the ephemeral runner, and the keystore file is removed in the
      # always-run cleanup step below regardless of build outcome.
      #
      # Required secrets (set these in repo Settings → Secrets → Actions —
      # see android/KEYSTORE.md for how to generate the keystore itself):
      #   ANDROID_KEYSTORE_BASE64   base64 of the .jks/.keystore file
      #   ANDROID_KEY_ALIAS
      #   ANDROID_KEY_PASSWORD
      #   ANDROID_STORE_PASSWORD
      # Secret ortam değişkeniyle geçer, betiğin METNİNE gömülmez (denetim
      # M-12): gömülen değer iş akışı betiğine yazılır ve kabuk
      # yorumlamasına açıktır.
      - name: Check signing secrets are configured
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail early with a clear message if signing isn't configured
        if: steps.signing.outputs.configured == 'false'
        run: |
          echo "::error::ANDROID_KEYSTORE_BASE64 (and the other ANDROID_* secrets) aren't set on this repo yet. See android/KEYSTORE.md to generate the upload keystore, then add it as a repo secret before pushing a release tag."
          exit 1

      # `google-services.json` is gitignored (docs/tr/GUVENLIK.md), so a store
      # build has to reconstruct it from a secret — same base64 pattern as the
      # keystore above. Unlike ci.yml, there is no placeholder fallback here on
      # purpose: an .aab built against a fake Firebase config would install and
      # then fail every auth, Firestore and App Check call at runtime.
      #
      # Required secret:
      #   GOOGLE_SERVICES_JSON_BASE64   base64 of android/app/google-services.json
      - name: Check the Firebase config secret is configured
        id: firebase
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail early if the Firebase config secret is missing
        if: steps.firebase.outputs.configured == 'false'
        run: |
          echo "::error::GOOGLE_SERVICES_JSON_BASE64 isn't set on this repo. Run: base64 -w0 android/app/google-services.json, then add the output as a repo secret before pushing a release tag."
          exit 1

      - name: Reconstruct google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json

      - name: Reconstruct keystore and key.properties
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > upload-keystore.jks
          cat > key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=$(pwd)/upload-keystore.jks
          EOF

      - name: Build signed App Bundle
        run: flutter build appbundle --release

      - name: Remove keystore and Firebase config from the runner
        if: always()
        working-directory: android
        run: rm -f upload-keystore.jks key.properties app/google-services.json

      - name: Upload signed App Bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ilnd-release-${{ github.ref_name }}
          path: build/app/outputs/bundle/release/*.aab
          retention-days: 90
